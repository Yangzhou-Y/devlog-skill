name: test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 自测
        run: python tests/selftest.py
      - name: 语法检查
        run: python -m py_compile scripts/collect_evidence.py scripts/check_log.py scripts/weekly.py scripts/index_logs.py
