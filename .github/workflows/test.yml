name: test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已升到 26.04，不再提供 3.8 的安装包
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 自测
        run: python tests/selftest.py
      - name: 语法检查
        run: python -m py_compile scripts/collect_evidence.py scripts/check_log.py scripts/weekly.py scripts/index_logs.py
