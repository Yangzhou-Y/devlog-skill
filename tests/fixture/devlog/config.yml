project: 示例项目
# 项目开发日志配置。collect_evidence.py 与 check_log.py 读取本文件。
# 放在 docs/devlog.yml。

# 工作流清单：STATE.md 的表行按此顺序排列，日志章节名尽量与之一致
workflows:
  - 数据链路
  - 数据分析
  - 上位机

# 阶段词表：只允许这些值，按项目实际情况增删
# 硬件项目可加：综合布线通过、位流已生成、实板已验证
# 软件项目可加：单元测试通过、集成测试通过、灰度发布
stages:
  - 设计
  - 已实现
  - 仿真通过
  - 实机验证
  - 联调通过
  - 已交付

# 任务状态词表
task_states:
  - 待办
  - 进行中
  - 阻塞
  - 顺延
  - 完成
  - 放弃

# 证据目录：指向这些目录的链接即使被 .gitignore 忽略也允许，但要求有产物 ID
evidence_dirs:
  - .sim
  - build
  - out
